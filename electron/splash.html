<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      font-family: 'Segoe UI', -apple-system, 'Microsoft YaHei', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
    }
    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #27272a;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .progress-track {
      width: 160px;
      height: 2px;
      background: #e4e4e7;
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-bar {
      width: 40%;
      height: 100%;
      background: #0f766e;
      border-radius: 1px;
      animation: loading 1.2s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .version {
      position: absolute;
      bottom: 12px;
      font-size: 10px;
      color: #d4d4d8;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2L4 7v9c0 7.73 5.12 14.96 12 17 6.88-2.04 12-9.27 12-17V7L16 2z" fill="url(#sg)"/>
      <path d="M16 4.5L6.5 8.5v7.5c0 6.4 4.27 12.4 9.5 14.2 5.23-1.8 9.5-7.8 9.5-14.2V8.5L16 4.5z" fill="url(#ig)" opacity="0.9"/>
      <path d="M16 9l4.5 2.6v5.2L16 19.4l-4.5-2.6v-5.2L16 9z" stroke="white" stroke-width="1.2" fill="none" opacity="0.9"/>
      <circle cx="16" cy="14.2" r="1.5" fill="white" opacity="0.95"/>
      <path d="M14.5 16.5l3-3M17.5 13.5l-0.2 2M17.5 13.5l-2 0.2" stroke="white" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
      <circle cx="11.5" cy="11.6" r="0.8" fill="white" opacity="0.6"/>
      <circle cx="20.5" cy="11.6" r="0.8" fill="white" opacity="0.6"/>
      <circle cx="16" cy="19.4" r="0.8" fill="white" opacity="0.6"/>
      <defs>
        <linearGradient id="sg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#115e59"/></linearGradient>
        <linearGradient id="ig" x1="6.5" y1="4.5" x2="25.5" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#14b8a6"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
      </defs>
    </svg>
  </div>
  <div class="title">GMPilot</div>
  <div class="subtitle">GMP 偏差智能分析系统</div>
  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
  <div class="version">v0.1.0</div>
</body>
</html>
